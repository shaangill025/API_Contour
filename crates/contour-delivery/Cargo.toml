[package]
name = "contour-delivery"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
contour-core = { path = "../contour-core" }
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
http-body-util = { version = "=0.1.5", default-features = false }
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring", "tls12"] }
tokio-rustls = { version = "=0.26.6", default-features = false, features = ["ring", "tls12"] }
bytes = "=1.12.1"
tokio = { version = "=1.53.2", features = ["rt", "time", "net", "io-util"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.145", features = ["raw_value"] }
time = { version = "=0.3.47", default-features = false, features = ["std"] }
httpdate = "=1.0.3"
ring = "=0.17.14"
