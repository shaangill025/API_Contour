name: Native checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    needs: [business, delivery, local-mvp, gateway]
    if: ${{ always() }}
    name: Rust 1.88 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    steps:
      - name: Require all prerequisite TLS jobs
        if: ${{ needs.business.result != 'success' || needs.delivery.result != 'success' || needs.local-mvp.result != 'success' || needs.gateway.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Node 22.23.1 for web checks
        if: runner.os == 'Linux' && hashFiles('web/package.json') != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.1"
          package-manager-cache: false
      - name: Validate web workspace
        if: runner.os == 'Linux' && hashFiles('web/package.json') != ''
        working-directory: web
        run: |
          npm ci --ignore-scripts --include=dev --include=optional
          npm run typecheck
          npm test
          npm run build
      - name: Select Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Validate specification offline
        run: python3 docs/specification/validate.py
      - name: Install pinned specification validators
        run: |
          python3 -m venv /tmp/apicontour-spec-validation
          /tmp/apicontour-spec-validation/bin/python -m pip install -r docs/specification/validation-requirements.txt
      - name: Validate schema and OpenAPI standards
        run: /tmp/apicontour-spec-validation/bin/python docs/specification/validate-standard.py
      - name: Install pinned Rust tools
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Fetch locked dependencies
        run: cargo +1.88.0 fetch --locked
      - name: Check formatting
        run: cargo +1.88.0 fmt --all -- --check
      - name: Check lint
        run: cargo +1.88.0 clippy --workspace --all-targets --locked --offline -- -D warnings
      - name: Run native tests
        run: cargo +1.88.0 test --workspace --locked --offline
      - name: Build native workspace
        run: cargo +1.88.0 build --workspace --locked --offline
      - name: Test native C structural interface
        timeout-minutes: 4
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: python3 scripts/test-native-abi.py
      - name: Test native and WebAssembly structural parity
        timeout-minutes: 4
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: python3 scripts/test-wasm-parity.py
      - name: Fetch pinned TLS database fixture
        if: runner.os == 'Linux'
        run: docker pull postgres@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
      - name: Test PostgreSQL TLS, transport failures and authority validation
        if: runner.os == 'Linux'
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: python3 scripts/test-postgres-tls.py --authority
      - name: Test scoped catalog reader through TLS and PostgreSQL
        if: runner.os == 'Linux'
        timeout-minutes: 4
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: python3 -u scripts/test-postgres-tls.py --catalog-reader
      - name: Test checked comparison persistence through TLS and PostgreSQL
        if: runner.os == 'Linux'
        timeout-minutes: 4
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: python3 -u scripts/test-postgres-tls.py --comparison-store

  business:
    name: Business TLS checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install pinned Rust tools
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Fetch locked dependencies
        run: cargo +1.88.0 fetch --locked
      - name: Fetch pinned TLS database fixture
        run: docker pull postgres@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
      - name: Build workspace and fixtures before TLS checks
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
          AWS_LC_SYS_USE_SYSTEM: '0'
        run: cargo +1.88.0 build --workspace --all-targets --locked --offline
      - name: Test whole-service import persistence through TLS and PostgreSQL
        if: runner.os == 'Linux'
        timeout-minutes: 4
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: python3 -u scripts/test-postgres-tls.py --service-import-store
      - name: Test human import authorization and revocation through TLS
        if: runner.os == 'Linux'
        timeout-minutes: 4
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
          AWS_LC_SYS_USE_SYSTEM: '0'
        run: python3 -u scripts/test-postgres-tls.py --human-import
      - name: Test atomic review decisions through TLS and PostgreSQL
        if: runner.os == 'Linux'
        timeout-minutes: 4
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: python3 -u scripts/test-postgres-tls.py --review-store

  delivery:
    name: HTTPS delivery checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install pinned Rust tools
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Fetch locked dependencies
        run: cargo +1.88.0 fetch --locked
      - name: Fetch pinned TLS database fixture
        run: docker pull postgres@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
      - name: Build workspace and fixtures before TLS checks
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
          AWS_LC_SYS_USE_SYSTEM: '0'
        run: cargo +1.88.0 build --workspace --all-targets --locked --offline
      - name: Test operator-mapped HTTPS durable ingestion
        if: runner.os == 'Linux'
        timeout-minutes: 4
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: python3 scripts/test-postgres-tls.py --https-only
      - name: Test bounded collector delivery through HTTPS and PostgreSQL
        if: runner.os == 'Linux'
        timeout-minutes: 4
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: python3 -u scripts/test-postgres-tls.py --delivery-only

  local-mvp:
    name: Container MVP lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install pinned Rust tools
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Fetch locked dependencies
        run: cargo +1.88.0 fetch --locked
      - name: Install pinned response validators
        run: |
          python3 -m venv /tmp/apicontour-spec-validation
          /tmp/apicontour-spec-validation/bin/python -m pip install -r docs/specification/validation-requirements.txt
      - name: Fetch pinned infrastructure images
        run: |
          docker pull postgres@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
          docker pull quay.io/keycloak/keycloak@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
      - name: Build and start the complete local stack
        timeout-minutes: 10
        run: python3 deploy/local/up.py
      - name: Verify owner and viewer business workflows against public schemas
        timeout-minutes: 4
        run: /tmp/apicontour-spec-validation/bin/python deploy/local/check_business.py --external --validate-schema
      - name: Verify failed startup and durable restart
        timeout-minutes: 4
        run: python3 deploy/local/check_stack.py

  gateway:
    name: Managed gateway TLS
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Fetch approved immutable Envoy fixture
        run: docker pull envoyproxy/envoy:v1.37.11@sha256:7765ad61185fca9c9a770c9e2cad640d085d708ae9c22f3741345e88331472a4
      - name: Verify managed gateway TLS on Linux
        timeout-minutes: 5
        run: python3 scripts/test-managed-gateway.py
      - name: Verify bounded certificate state and publication failures
        run: python3 -B -m unittest discover -s tests/gateway -p test_certificates.py
      - name: Verify real certificate rotation and rollback
        timeout-minutes: 5
        run: python3 scripts/test-managed-certificate-lifecycle.py
      - name: Install pinned Rust tools for the synthetic host-service probe
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --target wasm32-unknown-unknown
      - name: Verify probe cleanup failure cannot report success
        run: python3 tests/fixtures/envoy-wasi-probe/test_cleanup.py
      - name: Verify pinned Envoy WASI host services
        timeout-minutes: 5
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: python3 scripts/test-envoy-wasi-probe.py

  postgres:
    name: PostgreSQL 16 identity
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch pinned database fixture
        run: docker pull postgres@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
      - name: Test identity and tenant isolation
        run: bash scripts/test-postgres.sh
