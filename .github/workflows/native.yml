name: Native checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    needs: [business, delivery, local-mvp, gateway, origin, origin-setup, causal-runtime, causal-registry, causal-sessions, causal-inbox, causal-journal, wire-composition, tls-discovery, causal-generation-binding, causal-owner-binding, managed-native-edge, origin21-onboarding]
    if: ${{ always() }}
    name: Rust 1.88 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Require all prerequisite TLS jobs
        if: ${{ needs.business.result != 'success' || needs.delivery.result != 'success' || needs.local-mvp.result != 'success' || needs.gateway.result != 'success' || needs.origin.result != 'success' || needs['origin-setup'].result != 'success' || needs['causal-runtime'].result != 'success' || needs['causal-registry'].result != 'success' || needs['causal-sessions'].result != 'success' || needs['causal-inbox'].result != 'success' || needs['causal-journal'].result != 'success' || needs['wire-composition'].result != 'success' || needs['tls-discovery'].result != 'success' || needs['causal-generation-binding'].result != 'success' || needs['causal-owner-binding'].result != 'success' || needs['managed-native-edge'].result != 'success' || needs['origin21-onboarding'].result != 'success' }}
        run: exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Node 22.23.5 for web and fixture checks
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.23.5"
          package-manager-cache: false
      - name: Validate web workspace
        if: runner.os == 'Linux' && hashFiles('web/package.json') != ''
        working-directory: web
        run: |
          npm ci --ignore-scripts --include=dev --include=optional
          npm run typecheck
          npm test
          npm run build
      - name: Select Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Validate specification offline
        run: python3 docs/specification/validate.py
      - name: Install pinned specification validators
        run: |
          python3 -m venv /tmp/apicontour-spec-validation
          /tmp/apicontour-spec-validation/bin/python -m pip install -r docs/specification/validation-requirements.txt
      - name: Validate schema and OpenAPI standards
        run: /tmp/apicontour-spec-validation/bin/python docs/specification/validate-standard.py
      - name: Install pinned Rust tools
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Fetch locked dependencies
        run: cargo +1.88.0 fetch --locked
      - name: Check formatting
        run: cargo +1.88.0 fmt --all -- --check
      - name: Check lint
        run: cargo +1.88.0 clippy --workspace --all-targets --locked --offline -- -D warnings
      - name: Run native tests
        run: cargo +1.88.0 test --workspace --locked --offline
      - name: Build native workspace
        run: cargo +1.88.0 build --workspace --locked --offline
      - name: Test native C structural interface
        timeout-minutes: 4
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: python3 scripts/test-native-abi.py
      - name: Test native and WebAssembly structural parity
        timeout-minutes: 4
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: python3 scripts/test-wasm-parity.py
      - name: Fetch pinned TLS database fixture
        if: runner.os == 'Linux'
        run: docker pull postgres@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
      - name: Test image archive and receiver fixture controls
        run: |
          python3 -B -m unittest discover -s tests/fixtures/node243-qualification -p 'test_*.py'
          python3 -B -m unittest discover -s tests/fixtures/node243-archive -p 'test_*.py'
          python3 -B -m unittest discover -s tests/fixtures/receiver504-image-probe -p 'test_*.py'
          python3 -B -m unittest discover -s tests/fixtures/causal-receiver-nodered -p 'test_*.py'
          python3 -B -m unittest discover -s tests/fixtures/receiver504-actual -p 'test_*.py'
          python3 -B -m unittest discover -s tests/fixtures/causal-receiver-enrollment -p 'test_*.py'
          python3 -B -m unittest discover -s tests/fixtures/causal-receiver-reader -p 'test_*.py'
          python3 -B -m unittest discover -s tests/fixtures/causal-receiver-issuer -p 'test_*.py'
          python3 -B -m unittest discover -s tests/fixtures/docker-metadata -p 'test_*.py'
          python3 -B -m unittest discover -s tests/fixtures/qualification-git -p 'test_*.py'
          node tests/fixtures/causal-receiver-nodered/test_diagnostics.js
          node tests/fixtures/receiver504-bootstrap/test.js
          node tests/fixtures/receiver504-permit/test.js
          node tests/fixtures/receiver504-profile/test.js
          node tests/fixtures/receiver504-exporter/test.js
          node tests/fixtures/receiver504-actual/test_parent.js
          node tests/fixtures/receiver504-startup/entrypoint.js
          node tests/fixtures/receiver504-startup/composition.js
          node tests/fixtures/receiver504-startup/outbox.js
          node tests/fixtures/receiver504-startup/proxy.js
          node tests/fixtures/receiver504-startup/loader.js
          node tests/fixtures/receiver504-startup/profile.js
      - name: Test fresh-session PostgreSQL fixture transport
        run: python3 -B -m unittest discover -s tests/fixtures/psql-transport -p test_transport.py
      - name: Test PostgreSQL TLS, transport failures and authority validation
        if: runner.os == 'Linux'
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: python3 scripts/test-postgres-tls.py --authority
      - name: Test scoped catalog reader through TLS and PostgreSQL
        if: runner.os == 'Linux'
        timeout-minutes: 4
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: python3 -u scripts/test-postgres-tls.py --catalog-reader
      - name: Test checked comparison persistence through TLS and PostgreSQL
        if: runner.os == 'Linux'
        timeout-minutes: 4
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: python3 -u scripts/test-postgres-tls.py --comparison-store

  causal-registry:
    name: Causal runtime registry qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Fetch pinned database fixture
        run: docker pull postgres@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
      - name: Test qualification driver failures
        run: python3 -B -m unittest discover -s tests/fixtures/causal-registry -p 'test_registry_driver.py'
      - name: Qualify causal runtime registry
        timeout-minutes: 8
        run: python3 -B scripts/test-postgres-causal-registry.py

  causal-sessions:
    name: Internal causal session qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Fetch pinned database fixture
        run: docker pull postgres@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
      - name: Test session driver failure handling
        run: python3 -B -m unittest discover -s tests/fixtures/causal-sessions -p 'test_session_driver.py'
      - name: Qualify internal causal sessions
        timeout-minutes: 12
        run: python3 -B scripts/test-postgres-causal-sessions.py

  causal-inbox:
    name: Authenticated causal ingestion qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Fetch locked Rust dependencies
        run: cargo +1.88.0 fetch --locked
      - name: Fetch pinned database fixture
        run: docker pull postgres@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
      - name: Test inbox qualification driver
        run: python3 -B -m unittest discover -s tests/fixtures/causal-inbox -p 'test_inbox_driver.py'
      - name: Qualify internal causal inbox
        timeout-minutes: 16
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: python3 -B scripts/test-postgres-causal-inbox.py
      - name: Test signed causal bridge qualification driver
        run: python3 -B -m unittest discover -s tests/fixtures/causal-bridge -p 'test_bridge_driver.py'
      - name: Qualify signed causal bridge through PostgreSQL TLS
        timeout-minutes: 16
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: python3 -B scripts/test-postgres-causal-bridge.py
      - name: Test causal HTTPS qualification driver
        run: python3 -B -m unittest discover -s tests/fixtures/causal-https -p 'test_https_driver.py'
      - name: Qualify causal mTLS receipt through PostgreSQL TLS
        timeout-minutes: 16
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: python3 -B scripts/test-postgres-causal-https.py

  causal-journal:
    name: Exact causal issue recovery qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Fetch locked Rust dependencies
        run: cargo +1.88.0 fetch --locked
      - name: Fetch pinned database fixture
        run: docker pull postgres@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
      - name: Test causal journal qualification driver
        run: python3 -B -m unittest discover -s tests/fixtures/causal-journal -p 'test_journal_driver.py'
      - name: Qualify original issue recovery through PostgreSQL TLS
        timeout-minutes: 16
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: python3 -B scripts/test-postgres-causal-journal.py

  wire-composition:
    name: Private causal producer and exporter composition
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Fetch pinned Node runtime
        run: docker pull docker.io/nodered/node-red:5.0.9@sha256:e085d4a06591fd0aca2ea2a91364d27f1a0e31e885675f77935e10f95412a963
      - name: Test qualification process and cleanup controls
        run: python3 -B -m unittest discover -s tests/fixtures/nodered-wire-composition -p test_driver.py
      - name: Qualify seven inactive component modes
        timeout-minutes: 10
        run: python3 -B scripts/test-nodered-wire-composition.py

  tls-discovery:
    name: TLS discovery and streaming catalog matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install pinned Rust tools
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Fetch locked dependencies
        run: cargo +1.88.0 fetch --locked
      - name: Fetch approved immutable fixture images
        run: |
          docker pull postgres@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
          docker pull docker.io/nodered/node-red:5.0.9@sha256:e085d4a06591fd0aca2ea2a91364d27f1a0e31e885675f77935e10f95412a963
          docker pull envoyproxy/envoy:v1.37.11@sha256:7765ad61185fca9c9a770c9e2cad640d085d708ae9c22f3741345e88331472a4
          docker pull rust:1.88.0-bookworm@sha256:af306cfa71d987911a781c37b59d7d67d934f49684058f96cf72079c3626bfe0
          docker pull debian:bookworm-slim@sha256:7ff6ba31527b9e336162fa061746c366c4b2032f4d2cff2078bea43f78efe3f8
      - name: Test matrix provenance, barrier and cleanup controls
        run: python3 -B -m unittest discover -s tests/fixtures/origin-sensor -p test_fixture.py
      - name: Qualify TLS forwarding and persisted catalog
        timeout-minutes: 20
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -B scripts/test-postgres-tls.py --tls-discovery-matrix

  causal-runtime:
    name: Fixed Node-RED causal runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Test qualification driver failure handling
        run: python3 -B -m unittest discover -s tests/fixtures/nodered-causal -p 'test_causal_driver.py'
      - name: Qualify fixed Node-RED runtime
        timeout-minutes: 8
        run: python3 -B scripts/test-nodered-causal.py

  business:
    name: Business TLS checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install pinned Rust tools
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Fetch locked dependencies
        run: cargo +1.88.0 fetch --locked
      - name: Fetch pinned TLS database fixture
        run: docker pull postgres@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
      - name: Build workspace and fixtures before TLS checks
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
          AWS_LC_SYS_USE_SYSTEM: '0'
        run: cargo +1.88.0 build --workspace --all-targets --locked --offline
      - name: Test whole-service import persistence through TLS and PostgreSQL
        if: runner.os == 'Linux'
        timeout-minutes: 4
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: python3 -u scripts/test-postgres-tls.py --service-import-store
      - name: Test human import authorization and revocation through TLS
        if: runner.os == 'Linux'
        timeout-minutes: 4
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
          AWS_LC_SYS_USE_SYSTEM: '0'
        run: python3 -u scripts/test-postgres-tls.py --human-import
      - name: Test atomic review decisions through TLS and PostgreSQL
        if: runner.os == 'Linux'
        timeout-minutes: 4
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: python3 -u scripts/test-postgres-tls.py --review-store

  delivery:
    name: HTTPS delivery checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install pinned Rust tools
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
      - name: Fetch locked dependencies
        run: cargo +1.88.0 fetch --locked
      - name: Fetch pinned TLS database fixture
        run: docker pull postgres@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
      - name: Build workspace and fixtures before TLS checks
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
          AWS_LC_SYS_USE_SYSTEM: '0'
        run: cargo +1.88.0 build --workspace --all-targets --locked --offline
      - name: Test operator-mapped HTTPS durable ingestion
        if: runner.os == 'Linux'
        timeout-minutes: 4
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: python3 scripts/test-postgres-tls.py --https-only
      - name: Test bounded collector delivery through HTTPS and PostgreSQL
        if: runner.os == 'Linux'
        timeout-minutes: 4
        env:
          RUSTUP_TOOLCHAIN: 1.88.0
        run: python3 -u scripts/test-postgres-tls.py --delivery-only

  local-mvp:
    name: Container MVP lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: 1.88.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Install pinned Rust tools
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Fetch locked dependencies
        run: cargo +1.88.0 fetch --locked
      - name: Install pinned response validators
        run: |
          python3 -m venv /tmp/apicontour-spec-validation
          /tmp/apicontour-spec-validation/bin/python -m pip install -r docs/specification/validation-requirements.txt
      - name: Fetch pinned infrastructure images
        run: |
          docker pull postgres@sha256:0ea6700a3b4f0ae6ce746519073558aed4d88a79d8d07622a9a644946c7319c4
          docker pull quay.io/keycloak/keycloak@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
      - name: Build and start the complete local stack
        timeout-minutes: 10
        run: python3 deploy/local/up.py
      - name: Verify owner and viewer business workflows against public schemas
        timeout-minutes: 4
        run: /tmp/apicontour-spec-validation/bin/python deploy/local/check_business.py --external --validate-schema
      - name: Verify failed startup and durable restart
        timeout-minutes: 4
        run: python3 deploy/local/check_stack.py
      - name: Test capture policy and provisioning regressions
        run: python3 -B -m unittest discover -s deploy/local -p 'test_capture*.py'
      - name: Start and verify synthetic capture profile
        timeout-minutes: 4
        run: |
          python3 deploy/local/capture_up.py
          python3 deploy/local/check_capture.py
      - name: Renew and verify synthetic capture policy
        timeout-minutes: 4
        run: |
          python3 deploy/local/capture_renew.py
          python3 deploy/local/check_capture.py
      - name: Stop synthetic capture services
        if: always()
        timeout-minutes: 2
        run: docker compose -f deploy/local/compose.yaml --profile capture stop capture-ingress capture-worker

      - name: Fetch pinned native pilot images
        run: |
          docker pull docker.io/nodered/node-red:5.0.9@sha256:e085d4a06591fd0aca2ea2a91364d27f1a0e31e885675f77935e10f95412a963
          docker pull envoyproxy/envoy:v1.37.11@sha256:7765ad61185fca9c9a770c9e2cad640d085d708ae9c22f3741345e88331472a4
          docker pull node:22.23.5-bookworm-slim@sha256:e9f565d32859f0cbfb52125eafe8be39390f24dac302dc3cdf566e8ba3ab21ee
          docker pull rust:1.88.0-bookworm@sha256:af306cfa71d987911a781c37b59d7d67d934f49684058f96cf72079c3626bfe0
          docker pull debian:bookworm-slim@sha256:7ff6ba31527b9e336162fa061746c366c4b2032f4d2cff2078bea43f78efe3f8
      - name: Test native pilot configuration and qualification regressions
        run: |
          python3 -B -m unittest discover -s deploy/pilot -p 'test_native*.py'
          python3 -B scripts/test-native-pilot.py --self-test
          python3 -B scripts/test-native-privacy.py --self-test
          python3 -B scripts/bench-native-gateway.py --self-test
          docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges -v "$PWD/deploy/pilot:/pilot:ro" node:22.23.5-bookworm-slim@sha256:e9f565d32859f0cbfb52125eafe8be39390f24dac302dc3cdf566e8ba3ab21ee node /pilot/test_probe.js
      - name: Verify native pilot TLS rejection and capture outage recovery
        timeout-minutes: 6
        run: python3 scripts/test-native-pilot.py
      - name: Verify isolated native privacy and shutdown leak control
        timeout-minutes: 6
        run: python3 -B scripts/test-native-privacy.py --qualify
      - name: Stop native pilot services
        if: always()
        timeout-minutes: 2
        run: docker compose -f deploy/pilot/compose.yaml -f deploy/pilot/native-overlay.yaml --profile native-capture down --timeout 10

  gateway:
    name: Managed gateway TLS
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Fetch approved immutable Envoy fixture
        run: docker pull envoyproxy/envoy:v1.37.11@sha256:7765ad61185fca9c9a770c9e2cad640d085d708ae9c22f3741345e88331472a4
      - name: Verify managed gateway TLS on Linux
        timeout-minutes: 5
        run: python3 scripts/test-managed-gateway.py
      - name: Verify bounded certificate state and publication failures
        run: python3 -B -m unittest discover -s tests/gateway -p test_certificates.py
      - name: Verify real certificate rotation and rollback
        timeout-minutes: 5
        run: python3 scripts/test-managed-certificate-lifecycle.py
      - name: Install pinned Rust tools for the synthetic host-service probe
        run: rustup toolchain install 1.88.0 --profile minimal --component rustfmt --target wasm32-unknown-unknown
      - name: Verify probe cleanup failure cannot report success
        run: python3 tests/fixtures/envoy-wasi-probe/test_cleanup.py
