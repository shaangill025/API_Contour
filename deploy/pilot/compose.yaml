name: apicontour-pilot
services:
  destination:
    image: docker.io/nodered/node-red:5.0.9@sha256:e085d4a06591fd0aca2ea2a91364d27f1a0e31e885675f77935e10f95412a963
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    entrypoint: ["node", "/pilot/destination.js"]
    environment:
      PILOT_DESTINATION_MODE: "${PILOT_DESTINATION_MODE:-normal}"
    volumes:
      - ./destination.js:/pilot/destination.js:ro
      - ../../.local-mvp/ca.crt:/pilot/ca.crt:ro
      - ../../.local-mvp/pilot/destination/server.crt:/pilot/tls/server.crt:ro
      - ../../.local-mvp/pilot/destination/server.key:/pilot/tls/server.key:ro
    networks:
      default:
        aliases: [pilot-destination]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 192m
    cpus: 1
    restart: "no"
  replica1: &replica
    image: docker.io/nodered/node-red:5.0.9@sha256:e085d4a06591fd0aca2ea2a91364d27f1a0e31e885675f77935e10f95412a963
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    entrypoint: ["node", "/usr/src/node-red/node_modules/node-red/red.js", "--userDir", "/data", "--settings", "/pilot/settings.js"]
    environment:
      PILOT_TARGET: "${PILOT_TARGET:-https://pilot-destination:9443/pilot}"
      PILOT_TLS_TEST: "${PILOT_TLS_TEST:-normal}"
    ports: ["127.0.0.1:18811:1880"]
    volumes:
      - ./settings.js:/pilot/settings.js:ro
      - ./flows.json:/pilot/flows.json:ro
      - ./flows-wrong-name.json:/pilot/flows-wrong-name.json:ro
      - ./flows-wrong-ca.json:/pilot/flows-wrong-ca.json:ro
      - ./check_tls.js:/pilot/check_tls.js:ro
      - ../../.local-mvp/ca.crt:/pilot/ca.crt:ro
      - ../../.local-mvp/pilot/replica1/client.crt:/pilot/tls/client.crt:ro
      - ../../.local-mvp/pilot/replica1/client.key:/pilot/tls/client.key:ro
      - ../../.local-mvp/pilot/replica1/server.crt:/pilot/tls/server.crt:ro
      - ../../.local-mvp/pilot/replica1/server.key:/pilot/tls/server.key:ro
    read_only: true
    tmpfs: ["/data:rw,nosuid,nodev,noexec,size=16m,mode=1777", "/tmp:rw,nosuid,nodev,noexec,size=16m,mode=1777"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 256m
    cpus: 1
    restart: "no"
  replica2:
    <<: *replica
    ports: ["127.0.0.1:18812:1880"]
    volumes:
      - ./settings.js:/pilot/settings.js:ro
      - ./flows.json:/pilot/flows.json:ro
      - ./flows-wrong-name.json:/pilot/flows-wrong-name.json:ro
      - ./flows-wrong-ca.json:/pilot/flows-wrong-ca.json:ro
      - ./check_tls.js:/pilot/check_tls.js:ro
      - ../../.local-mvp/ca.crt:/pilot/ca.crt:ro
      - ../../.local-mvp/pilot/replica2/client.crt:/pilot/tls/client.crt:ro
      - ../../.local-mvp/pilot/replica2/client.key:/pilot/tls/client.key:ro
      - ../../.local-mvp/pilot/replica2/server.crt:/pilot/tls/server.crt:ro
      - ../../.local-mvp/pilot/replica2/server.key:/pilot/tls/server.key:ro
networks:
  default:
    internal: true
