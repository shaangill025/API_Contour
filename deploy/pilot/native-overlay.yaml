# Opt-in only: combine with deploy/pilot/compose.yaml after provisioning.
services:
  native-gateway:
    image: apicontour-local-app
    profiles: [native-capture]
    user: "${LOCAL_UID:-65534}:${LOCAL_GID:-65534}"
    entrypoint: ["/usr/local/bin/local_gateway", "/run/native/gateway.json"]
    volumes:
      - ../../.local-mvp/pilot/native/gateway:/run/native:ro
    networks:
      - default
      - capture
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 256m
    cpus: 1
    restart: "no"
  native-envoy:
    image: envoyproxy/envoy:v1.37.11@sha256:7765ad61185fca9c9a770c9e2cad640d085d708ae9c22f3741345e88331472a4
    profiles: [native-capture]
    user: "${LOCAL_UID:-65534}:${LOCAL_GID:-65534}"
    command: ["-c", "/run/forwarder/envoy.json", "--log-level", "error"]
    volumes:
      - ../../.local-mvp/pilot/native/forwarder:/run/forwarder:ro
    networks:
      default:
        aliases: [pilot-gateway]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 256m
    cpus: 1
    restart: "no"
networks:
  capture:
    external: true
    name: apicontour-local_default
